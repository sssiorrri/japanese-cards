<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日文句子隨機單字卡</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Heiti TC", "Microsoft JhengHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f7fa;
            margin: 0;
            user-select: none;
        }

        .card-container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 40px 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .card-container:active {
            transform: scale(0.99);
        }

        .japanese-text {
            font-size: 1.35rem;
            color: #2c3e50;
            line-height: 1.6;
            margin-bottom: 20px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chinese-text {
            font-size: 1.05rem;
            color: #4a90e2;
            line-height: 1.5;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
            font-weight: 500;
        }

        .hidden {
            visibility: hidden;
            opacity: 0;
        }

        .hint-text {
            font-size: 0.85rem;
            color: #bdc3c7;
            margin-top: 15px;
            margin-bottom: 25px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            font-size: 0.95rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-speak {
            background-color: #eef9f2;
            color: #27ae60;
            border: 1px solid #27ae60;
        }

        .btn-speak:hover {
            background-color: #27ae60;
            color: white;
        }

        .btn-next {
            background-color: #4a90e2;
            color: white;
        }

        .btn-next:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>

<div class="card-container" onclick="showTranslation()">
    <div id="jpText" class="japanese-text">點擊下方按鈕開始抽考</div>
    <div id="zhText" class="chinese-text hidden"></div>

    <div class="hint-text">💡 點擊卡片任意處即可顯示中文翻譯</div>

    <div class="button-group">
        <button class="btn-speak" onclick="event.stopPropagation(); speakJapanese();">🔊 重新發音</button>
        <button class="btn-next" onclick="event.stopPropagation(); nextCard();">下一題 ➔</button>
    </div>
</div>

<script>
    const sentences = [
        { jp: "毎朝、仕事に行く前にコーヒーを一杯飲むようにしています。", zh: "每天上班前習慣喝一杯咖啡再去。" },

        { jp: "朝ごはんを食べないと、午前中にお腹が空いてしまいます。", zh: "不吃早餐的話，中午之前肚子就會很餓。" },
        { jp: "最近は外食するより、自分で料理を作ることが多くなりました。", zh: "最近比起外食，自己煮飯的次數變多了。" },
        { jp: "疲れているときは、無理をしないほうがいいですよ。", zh: "疲累的時候，不要勉強自己會比較好。" },
        { jp: "この服、デザインはいいんですが、少し高すぎると思います。", zh: "這件衣服雖然設計不錯，但我覺得有點太貴。" },
        { jp: "これと同じような商品で、もう少し安いものはありませんか。", zh: "有和這個款式一樣，但比較便宜的嗎？" },

        { jp: "この商品は人気があるらしくて、最近よく売れているそうです。", zh: "這件商品很受歡迎，最近好像很熱賣。" },
        { jp: "セール中なので、普段よりかなり安く買えますよ。", zh: "因為在特價中，比平常還要便宜就能買到喔。" },
        { jp: "これを買うかどうか、もら少し考えてから決めたいです。", zh: "要不要買這個，我想再考慮一下再決定。" },
        { jp: "買う前に、ほかの店の値段も調べてみたほうがいいと思います。", zh: "購買之前，我覺得查一下其他店的價格會比較好。" },
        { jp: "この店は人気があるので、予約しておいたほうがいいですよ。", zh: "這家店很受歡迎，建議先訂位比較好喔。" },

        { jp: "初めて行く場所なので、道に迷わないか心配です。", zh: "因為是第一次去的地方，我擔心會不會迷路。" },

        { jp: "急な用事が入ってしまったので、約束を別の日にしてもらえませんか。", zh: "因為突然有急事，可以把約定改到別天嗎？" },
        { jp: "都合が悪くなったら、できるだけ早く知らせてください。", zh: "如果有事不能來的話，請盡快通知我。" },
        { jp: "来週の土曜日なら、今のところ予定は入っていません。", zh: "如果是下周六的話，現在還沒有任何安排。" },
        { jp: "天気が悪かった場合は、予定を変更することにしましょう。", zh: "如果天氣不好的話，就更改預定的行程吧。" },
        { jp: "この授業は毎週月曜日にあります。", zh: "這堂課每週一有課（這門課每週一上課）。" },
        { jp: "今日は体調がよくないので、授業を休みたいです。", zh: "今天身體有點不舒服，所以想請假不上課。" },
        { jp: "授業が終わったら、一緒に昼ご飯を食べませんか。", zh: "下課之後，要不要一起吃午飯呢？" },
        { jp: "明日の発表のために、今晩練習するつもりです。", zh: "為了明天的發表（簡報），我打算今晚練習。" },
        { jp: "グループで話し合ってから、答えを決めましょう。", zh: "大家分組討論之後，再來決定答案吧。" },
        { jp: "先生が説明しているときは、よく聞いてください。", zh: "老師在說明的時候，請好好認真聽。" },
        { jp: "この課題は思ったより難しいですが、頑張ってやってみます。", zh: "這項作業（課題）比想像中還要難，但我會努力試著做做看。" },
        { jp: "レポートを書く前に、必要な資料を集めておいたほうがいいと思います。", zh: "我覺得在寫報告之前，最好先將需要的資料收集好。" },
        { jp: "授業に遅れそうだったので、朝ご飯を食べずに家を出ました。", zh: "因為快要上課遲到了，所以沒吃早餐就出門了。" },
        { jp: "分からないところをそのままにしないで、先生や友達に聞くようにしています。", zh: "我不讓不懂的地方放著不管，都會盡量去請教老師或詢問朋友。" },
        { jp: "はじめは仕事のやり方がよくわかりませんでした。", zh: "我剛開始不太清楚/了解工作的作法" },
        { jp: "明日は朝早くから仕事があるので、今日は早く寝るつもりです。", zh: "因為明天一大早就有工作，我打算今天早點睡。" },
        { jp: "仕事に慣れるまで、少し時間がかかりました。", zh: "熟悉/習慣這份工作我花了一些時間。" },
        { jp: "シフトを変更したいんですが、お願いできますか。", zh: "我想要改排班時間/排班表，可以拜託您嗎?" },
        { jp: "仕事に遅れそうなときは、できるだけ早く連絡してください。", zh: "上班可能會/快要遲到的時候，請盡早聯絡。" },
        { jp: "お客様に聞かれたことが分からなかったので、先輩に確認しました。", zh: "因為客人的問題我不知道怎麼回答，所以我去跟前輩確認。" },
        { jp: "仕事で失敗してしまいましたが、次に同じ間違いをしないように気をつけます。", zh: "雖然工作上犯了錯，下次會注意避免再犯同樣的錯誤。" },
        { jp: "忙しい時間が終わったので、少し休憩してから仕事を続けましょう。", zh: "忙碌的時間結束了，稍微休息後再繼續工作吧。" },
        { jp: "学校とアルバイトを両立するのは大変ですが、時間をうまく使うようにしています。", zh: "雖然兼顧要學校跟打工很辛苦，但是我會盡量善用時間。" },
        { jp: "仕事をうして通し日本語を使う機会が増えたので、前より話しやすくなりました。", zh: "因為工作上使用日文的機會變多了，所以比以前講得更流暢了。" },
        { jp: "明日は早く起きなければならないので、今晩はテレビを見ないで早く寝るつもりです。", zh: "因為明天必須早起，所以今晚打算不看電視早點睡覺。" },
        { jp: "毎日忙しいですが、できるだけ時間を作って日本語の新聞を読むようにしています。", zh: "雖然每天都很忙，但我盡量抽出時間看日文的報紙。" },
        { jp: "週末、天気が良ければ、友達と一緒に郊外に出かけたいと思っています。", zh: "週末如果天氣好的話，我想和朋友一起去郊外走走。" },
        { jp: "以前はあまり運動が好きではありませんでしたが、最近は健康のために、週に2回ジムに通い始めました。", zh: "以前我不是很喜歡運動，但最近為了健康，開始一週去兩次健身房。" },
        { jp: "日本へ旅行に行くときは、地図を見ながら電車の時間や乗り換えの方法を確認します。", zh: "去日本旅行時，我一邊看地圖，一邊確認電車的時間和轉乘方式。" },
        { jp: "仕事がまだ終わっていないので、友達に誘われても、食事をてかけることができません。", zh: "因為工作還沒結束，所以即使朋友邀請我，也無法出去吃飯。" },
        { jp: "来月、日本語能力試験を受けるつもりなので、毎日少しとも1時間勉強するようにしています。", zh: "因為打算參加下個月的日檢，所以每天盡量保持至少讀書一小時。" },
        { jp: "試験の前日は、友達と一緒に図書館で勉強してから、近くのレストランで夕食を食べました。", zh: "考試前一天，我和朋友一起在圖書館讀書，之後在附近的餐廳吃晚餐。" },
        { jp: "わからない単語があっても、すぐに辞書を引かずに、まず文脈から意味を推測してみてください。", zh: "即使遇到不懂的單字，不要馬上查字典，先試著從上下文推測字義。" },

        { jp: "体調が悪くなったので、予定を変更してホテルで休むことにしました。", zh: "因為身體狀態不好，所以我變更行程決定在飯店休息。" },
        { jp: "道が混んでいるようなので、少し早めに出たほうが良さそうです。", zh: "路上好像很塞，看來早一點出發比較好。" },

        { jp: "最近、物の値段が上がっているので、生活費も増えています。", zh: "最近因為物價上漲，生活費的支出也增加。" },
        { jp: "雨が続いているため、野菜の値段が高くなっています。", zh: "因為雨一直下，蔬菜的價錢也變高了。" },
        { jp: "天気が悪くなる前に、必要な物を買っておいたほうがいいと思います。", zh: "在天氣變差之前，我覺得先去買一些必要的物品比較好。" },
        { jp: "インターネットで簡単に情報を調べられるようになりました。", zh: "現在已經可以更很簡單的在網路查詢到資訊。" },
        { jp: "日本では、地域によって生活のルールが違うこともあります。", zh: "在日本，有時候地區不同生活習慣也會有不同。" },
        { jp: "ごみのたしかたについて、外国人にもわかりやすい案内が必要だと思います。", zh: "關於垃圾丟棄的方式，我覺得需要有讓外國人也容易理解的說明。" },
        { jp: "最近は環境について考える人が増え、マイバッグを使う人も多くなりました。", zh: "最近在意環境問題的人增加，使用環保(購物)袋的人也變多了。" }
    ];

    let currentIndex = -1;

    function speakJapanese() {
        if (currentIndex < 0 || currentIndex >= sentences.length) return;

        window.speechSynthesis.cancel();

        const text = sentences[currentIndex].jp;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "ja-JP";
        utterance.rate = 0.9;

        const voices = window.speechSynthesis.getVoices();
        const jaVoice = voices.find(v => v.lang === "ja-JP" || v.lang.startsWith("ja"));
        if (jaVoice) utterance.voice = jaVoice;

        window.speechSynthesis.speak(utterance);
    }

    function nextCard() {
        if (sentences.length === 0) return;

        let newIndex;
        do {
            newIndex = Math.floor(Math.random() * sentences.length);
        } while (newIndex === currentIndex && sentences.length > 1);

        currentIndex = newIndex;

        document.getElementById("jpText").innerText = sentences[currentIndex].jp;
        document.getElementById("zhText").innerText = sentences[currentIndex].zh;
        document.getElementById("zhText").classList.add("hidden");

        speakJapanese();
    }

    function showTranslation() {
        if (currentIndex < 0) return;
        document.getElementById("zhText").classList.remove("hidden");
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }
</script>

</body>
</html>
